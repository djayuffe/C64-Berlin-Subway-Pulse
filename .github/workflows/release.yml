name: Release verification

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y acme python3
      - name: Build and inspect PRG
        run: make
      - name: Verify release manifest
        run: sha256sum -c SHA256SUMS.txt
      - name: Upload release PRG
        uses: actions/upload-artifact@v4
        with:
          name: berlin-subway-pulse-${{ github.ref_name }}
          path: build/subway.prg
